name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible, linters and collections
        run: |
          pip install --quiet ansible ansible-lint yamllint
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint -d relaxed ansible/
      - name: ansible-lint
        run: ansible-lint ansible/roles/ ansible/playbooks/
      - name: Playbook syntax check
        run: |
          for pb in ansible/playbooks/*.yml; do
            echo "=== $pb"
            ansible-playbook -i ansible/inventory.yml "$pb" --syntax-check
          done

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
      - name: Format check
        run: tofu -chdir=tofu fmt -check -recursive
      # providers.tf reads the automation SSH key with file(), which must
      # exist at validate time; CI gets a throwaway key in its place.
      - name: Placeholder SSH key
        run: mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/ansible_ed25519
      - name: Validate
        run: |
          tofu -chdir=tofu init -backend=false -input=false
          tofu -chdir=tofu validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
