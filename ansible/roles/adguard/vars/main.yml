---
# Upstream DNS resolvers (Cloudflare + Quad9 as fallback)
adguard_upstreams:
  - "https://dns.cloudflare.com/dns-query"
  - "https://dns10.quad9.net/dns-query"

adguard_bootstrap_dns:
  - "1.1.1.1"
  - "9.9.9.9"

# arr (10.20.40.20) runs ~11 Docker containers that all share its host IP
# as seen by AdGuard, so their periodic RSS-sync/health-check timers landing
# in the same second routinely burst past the default 20 qps limit - AdGuard
# silently drops (not logs) anything over the limit, surfacing as Docker
# embedded-resolver "i/o timeout" errors for real lookups (Plex discovery,
# Newshosting). Confirmed via AdGuard's own query log: repeated exact-20-in-
# 1-second windows from 10.20.40.20 at the same moments Docker reported
# timeouts.
#
# Tried ratelimit_whitelist first (per-client exemption, narrower blast
# radius) but it had no measurable effect even after a service restart -
# likely a subnet-vs-IP matching quirk, since ratelimit_subnet_len_ipv4=24
# buckets clients by /24, not by individual IP. Raising the global limit
# instead - each VLAN's /24 gets its own independent bucket under this
# setting, so this only meaningfully changes behavior for VLAN 40 (arr's
# subnet), not the rest of the network. Verified live 2026-08-16: bursts
# and timeouts stopped after this change, whitelist attempt did not fix it.
adguard_ratelimit: 60
# The whitelist entry for the old arr LXC (10.20.40.20) was removed
# 2026-08-25 - it never did anything even before the 2026-08-21 split
# (see the comment above: the actual fix was the global limit, not this),
# and none of the three post-split hosts run anywhere near the ~11
# containers-on-one-IP density that caused the original burst issue.
# Caught by scripts/check_stale_ip_refs.py, see Known Issue #124's
# follow-up in docs/todo.md.
adguard_ratelimit_whitelist: []

