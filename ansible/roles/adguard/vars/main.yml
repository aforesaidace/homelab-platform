  # internal-only hostnames never touching the public ACME process (see
  # docs/todo.md), so this domain itself also stays off NPM/Traefik and
  # any public DNS record, resolved only via this internal rewrite.
  # ACME clients hit step-ca directly on :9000, matching its own default
  # convention (like prometheus/loki/ollama above).
  - domain: "step-ca.example.lab"
    answer: "10.20.30.47"
  # Direct to the actual-http-api wrapper's own IP, not NPM - a LAN-only
  # machine-to-machine API (the LLM-categorization script's caller), not
  # a human-facing web app. Added 2026-08-25 - matches the reasoning
