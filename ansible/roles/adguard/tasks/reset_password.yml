---
# Real reset mechanism (Known Issue #121, 2026-08-25): AdGuard stores the
# admin password as a bcrypt hash directly in AdGuardHome.yaml. The only task
# that could ever set it (install.yml's "Complete AdGuard Home initial setup
# via API") is guarded to run once, at first install - re-running the role
# after rotating `adguard_password` does nothing to an already-initialized
# instance. This task patches the hash in place instead.
#
# Opt-in only, deliberately not part of the normal converge - tagged `never`
# so a plain `ansible-playbook adguard.yml` run never touches this. Rotate by
# updating `adguard_password` in vault/secrets.yml, then running:
#   ansible-playbook -i ansible/inventory.yml ansible/playbooks/adguard.yml --tags password_reset

# Uses the raw `bcrypt` package via `uv run --with bcrypt` (no system
# package needed - workstation lost python-bcrypt in the 2026-09 rebuild; uv is on
# workstation and devbox) - the exact same call used to do this by hand for KI
# #121. Password goes over stdin, not argv, so it never appears in `ps`.
- name: Generate bcrypt hash for the new AdGuard admin password
  ansible.builtin.command:
    cmd: >-
      uv run --quiet --no-project --with bcrypt python3 -c "import bcrypt,sys; print(bcrypt.hashpw(sys.stdin.readline().rstrip(chr(10)).encode(), bcrypt.gensalt()).decode())"
    stdin: "{{ adguard_password }}"
  delegate_to: localhost
  become: false
  register: adguard_password_hash
  changed_when: false
  no_log: true

- name: Patch the admin password hash in AdGuardHome.yaml
  ansible.builtin.replace:
    path: "{{ adguard_install_dir }}/AdGuardHome.yaml"
    regexp: "(- name: {{ adguard_user }}\\n\\s+password: ).*"
    replace: '\1{{ adguard_password_hash.stdout }}'
  no_log: true
  register: adguard_password_patched

# Deliberately a plain conditional task, not a handler - same reasoning as
# install.yml's own AdGuard tasks: this needs to run inline, immediately,
# and before the verify step below, not deferred to end-of-play.
- name: Restart AdGuardHome to pick up the new password hash # noqa: no-handler
  ansible.builtin.systemd:
    name: AdGuardHome
    state: restarted
  when: adguard_password_patched is changed

- name: Verify the new AdGuard admin password authenticates # noqa: no-handler
  ansible.builtin.uri:
    url: "{{ adguard_api_url }}/control/status"
    method: GET
    user: "{{ adguard_user }}"
    password: "{{ adguard_password }}"
    force_basic_auth: true
    status_code: 200
  when: adguard_password_patched is changed
