---
# Real reset mechanism (Known Issue #121, 2026-08-25): `admin_password` in
# grafana.ini only seeds the account on Grafana's very first-ever boot -
# changing it later and re-running the role does nothing to an
# already-initialized instance. grafana-cli's reset-admin-password command is
# the actual fix, and it must run with grafana-server STOPPED first - running
# it live silently "succeeds" per its own output but doesn't take effect
# against a locked sqlite DB. It resets the original bootstrap admin account
# by id, not by login name, so this works even though the real live login was
# later renamed away from "admin" (found the same session - see KI #121).
#
# Opt-in only, deliberately not part of the normal converge - tagged `never`
# so a plain run of monitoring.yml (grafana has no dedicated playbook - it's
# one role among several in playbooks/monitoring.yml) never touches this.
# Rotate by updating `grafana_admin_password` in vault/secrets.yml, then:
#   ansible-playbook -i ansible/inventory.yml ansible/playbooks/monitoring.yml --tags password_reset

- name: Stop grafana-server before resetting the admin password
  ansible.builtin.systemd:
    name: grafana-server
    state: stopped

- name: Reset the Grafana admin password via grafana-cli
  ansible.builtin.command:
    cmd: >-
      grafana-cli --homepath=/usr/share/grafana --config={{ grafana_config_dir }}/grafana.ini
      admin reset-admin-password {{ grafana_admin_password }}
  changed_when: true
  no_log: true

- name: Start grafana-server back up
  ansible.builtin.systemd:
    name: grafana-server
    state: started

- name: Wait for Grafana to come back up
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 15
  delay: 2
