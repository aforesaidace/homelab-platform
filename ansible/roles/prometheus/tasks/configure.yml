---
- name: Deploy fleet alert rules
  ansible.builtin.template:
    src: rules/fleet.rules.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/fleet.rules.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0640'
    validate: "{{ prometheus_install_dir }}/promtool check rules %s"
  notify: Restart prometheus
  tags: [configure]

- name: Deploy prometheus.yml config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0640'
    validate: "{{ prometheus_install_dir }}/promtool check config %s"
  notify: Restart prometheus
  tags: [configure]
