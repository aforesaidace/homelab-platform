---
# Nautobot -> Prometheus `node` job targets (docs/todo.md Initiative 1).

- name: Ensure nautobot_sd directory exists
  ansible.builtin.file:
    path: "{{ prometheus_nautobot_sd_dir }}"
    state: directory
    mode: "0750"

- name: Ensure file_sd output directory exists
  ansible.builtin.file:
    path: "{{ prometheus_nautobot_sd_output | dirname }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

# secret_id grants read on secret/proxmox + secret/homepage + secret/drift-check
# via the reused drift-check-kv AppRole - kept as its own 0600 file, never
# templated inline into run.sh, same separation every other AppRole
# secret_id gets in this repo.
- name: Deploy nautobot_sd Vault secret_id
  ansible.builtin.copy:
    content: "{{ prometheus_nautobot_sd_secret_id }}"
    dest: "{{ prometheus_nautobot_sd_dir }}/secret_id"
    mode: "0600"
  no_log: true

- name: Deploy nautobot_prometheus_sd.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/nautobot_prometheus_sd.py"
    dest: "{{ prometheus_nautobot_sd_dir }}/nautobot_prometheus_sd.py"
    mode: "0750"
  register: _nautobot_sd_script

- name: Remove the retired node-role map (roles now come from Nautobot)
  ansible.builtin.file:
    path: "{{ prometheus_nautobot_sd_dir }}/role_map.yml"
    state: absent

- name: Deploy nautobot_sd runner
  ansible.builtin.template:
    src: nautobot_sd_run.sh.j2
    dest: "{{ prometheus_nautobot_sd_dir }}/run.sh"
    mode: "0750"
  register: _nautobot_sd_runner

- name: Deploy nautobot-sd systemd service unit
  ansible.builtin.template:
    src: nautobot-sd.service.j2
    dest: /etc/systemd/system/nautobot-sd.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy nautobot-sd systemd timer
  ansible.builtin.template:
    src: nautobot-sd.timer.j2
    dest: /etc/systemd/system/nautobot-sd.timer
    mode: "0644"
  notify: Reload systemd

- name: Enable and start nautobot-sd timer
  ansible.builtin.systemd:
    name: nautobot-sd.timer
    state: started
    enabled: true
    daemon_reload: true

# The node job reads only this file, so refresh it as soon as the script
# changes rather than waiting up to 5 min for the timer (hosts the old
# script didn't emit would go unscraped in between).
- name: Refresh the node targets now
  ansible.builtin.systemd:
    name: nautobot-sd.service
    state: started
  when: _nautobot_sd_script is changed or _nautobot_sd_runner is changed
