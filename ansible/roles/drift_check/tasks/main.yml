---
- name: Ensure drift-check directory exists
  ansible.builtin.file:
    path: "{{ drift_check_dir }}"
    state: directory
    mode: "0750"

# secret_id grants read on secret/proxmox + secret/homepage via the
# drift-check-kv AppRole - kept as its own 0600 file, never templated
# inline into run.sh, same separation every other AppRole secret_id gets
# in this repo (ansible/.vault_secret_ids.yml, fleet_monitor role).
- name: Deploy drift-check Vault secret_id
  ansible.builtin.copy:
    content: "{{ drift_check_secret_id }}"
    dest: "{{ drift_check_dir }}/secret_id"
    mode: "0600"
  no_log: true

- name: Deploy drift-check runner
  ansible.builtin.template:
    src: run.sh.j2
    dest: "{{ drift_check_dir }}/run.sh"
    mode: "0750"

- name: Deploy drift-check systemd service unit
  ansible.builtin.template:
    src: drift-check.service.j2
    dest: /etc/systemd/system/drift-check.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy drift-check systemd timer
  ansible.builtin.template:
    src: drift-check.timer.j2
    dest: /etc/systemd/system/drift-check.timer
    mode: "0644"
  notify: Reload systemd

- name: Enable and start drift-check timer
  ansible.builtin.systemd:
    name: drift-check.timer
    state: started
    enabled: true
    daemon_reload: true
