  # Actual requires these exact response headers client-side for
  # SharedArrayBuffer (its WASM SQLite engine) and the Web Crypto API
  # (E2E encryption) - both need a Secure Context. See
  # https://actualbudget.org/docs/config/reverse-proxies/ - equivalent
  # to NPM's per-location advanced_config block, done here as a Traefik
  # headers middleware attached only to this one router.
  - domain: "actual.example.lab"
    forward_host: "10.20.30.35"
    forward_port: 5006
    headers_middleware:
      customResponseHeaders:
        Cross-Origin-Embedder-Policy: "require-corp"
        Cross-Origin-Opener-Policy: "same-origin"
        Origin-Agent-Cluster: "?1"
  - domain: "paperless.example.lab"
    forward_host: "10.20.30.34"
    forward_port: 8000
  - domain: "dashy.example.lab"
    forward_host: "10.20.30.40"
