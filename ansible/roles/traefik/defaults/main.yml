---
traefik_image: "traefik"
traefik_image_tag: "v3.7.11"
traefik_container: traefik
traefik_data_root: /opt/traefik
traefik_acme_email: "ops@example.lab"

# Real value lives in OpenBao (secret/cloudflare) via the traefik-kv
# AppRole - the same credential npm already uses for its own DNS-01
# renewal, not a Traefik-specific one.
cloudflare_api_token: "changeme"

# Mirrors scripts/npm_setup.py's PROXY_HOSTS - same domains, same
# backends. Kept as a separate list here rather than importing that
# script's data structure directly (Python vs Jinja/YAML) - npm_setup.py
# stays frozen/untouched until NPM is actually decommissioned (Phase 3),
# this becomes the new single source of truth going forward.
traefik_hosts:
  - domain: "grafana.example.lab"
    forward_host: "10.20.30.14"
    forward_port: 3000
  - domain: "ai.example.lab"
    forward_host: "10.20.30.10"
    forward_port: 8080
