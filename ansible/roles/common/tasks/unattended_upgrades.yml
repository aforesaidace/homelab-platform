---
- name: Ensure unattended-upgrades package is installed
  apt:
    name: unattended-upgrades
    state: present
  when: inventory_hostname not in groups['proxmox_nodes']
  tags: [common, install, upgrades]

- name: Deploy unattended-upgrades configuration
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname not in groups['proxmox_nodes']
  tags: [common, configure, upgrades]

- name: Enable automatic upgrades
  template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname not in groups['proxmox_nodes']
  tags: [common, configure, upgrades]
