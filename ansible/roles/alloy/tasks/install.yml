---
# Debian/Ubuntu (the whole fleet) installs from Grafana's apt repo; Arch
# (workstation) uses the distro package from `extra`, which differs in package
# name, service name, user and config dir - see the Archlinux overrides in
# host_vars/workstation.yml.
- name: Install Alloy (Debian family)
  ansible.builtin.import_tasks: install_debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install Alloy (Arch)
  community.general.pacman:
    name: "{{ alloy_package_name }}"
    state: present
  when: ansible_facts['os_family'] == "Archlinux"
