---
# VRRP virtual router ID shared by all members of one keepalived group -
# must match across every host in the same failover set, must be unique
# per L2 segment if other VRRP groups ever share this VLAN.
keepalived_router_id: 51
keepalived_vip: "10.20.1.10"
keepalived_vip_cidr: 24
keepalived_interface: eth0
keepalived_priority: 100
keepalived_state: BACKUP
keepalived_health_check_port: 53
keepalived_health_check_interval: 2
